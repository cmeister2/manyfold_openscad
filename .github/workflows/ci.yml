name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test plugin and package (Manyfold ${{ matrix.manyfold }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - manyfold: 0.150.0
            image: manyfold3d/manyfold-solo:0.150.0@sha256:f171f544b81ab92d373906a22114f65851b5b4f30861883baed754ca94651a7d
            expected_host_version: 0.150.0
          - manyfold: latest
            image: manyfold3d/manyfold-solo:latest
            expected_host_version: ''
    env:
      OPENSCAD_TEST_IMAGE: ${{ matrix.image }}
      OPENSCAD_TEST_HOST_VERSION: ${{ matrix.expected_host_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull Manyfold test image
        run: docker pull "$OPENSCAD_TEST_IMAGE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bin/test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  release:
    name: Preview or publish plugin release
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run release:dry-run
      - name: Tag and publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  success:
    name: Success
    if: ${{ always() }}
    needs: [test, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_RESULTS"
