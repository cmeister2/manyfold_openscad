name: manyfold-openscad-dev

services:
  manyfold:
    build: .
    image: manyfold-openscad-dev
    ports:
      - "127.0.0.1:${OPENSCAD_PORT:-3216}:3214"
    environment:
      SECRET_KEY_BASE: local-plugin-development-only-8e7b41e9a6c547ca8b32c78c887bb7be
      PLUGINS_PATH: /plugins
      MULTIUSER: disabled
      PUID: "1000"
      PGID: "1000"
      OPENSCAD_MAX_SOURCE_BYTES: ${OPENSCAD_MAX_SOURCE_BYTES:-1048576}
      OPENSCAD_MAX_OUTPUT_BYTES: ${OPENSCAD_MAX_OUTPUT_BYTES:-33554432}
      OPENSCAD_GENERATION_TIMEOUT_MS: ${OPENSCAD_GENERATION_TIMEOUT_MS:-120000}
    volumes:
      - local-config:/config
      - .:/plugins/manyfold_openscad:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3214/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

volumes:
  local-config:
